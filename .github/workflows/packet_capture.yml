name: CIPAT Wireshark Network Capture

on:
  workflow_dispatch:
  push:

jobs:
  capture-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Wireshark CLI Tools
        run: |
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump tshark
          pip install cryptography pycryptodome pillow

      - name: Run End-to-End Simulation with Packet Capture
        run: |
          python -c "
          import struct, time, os, hashlib
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad, unpad
          from cryptography.hazmat.primitives.asymmetric import rsa, padding
          from cryptography.hazmat.primitives import hashes

          # 1. Payload Creation
          financial_text = '''================================================================================
          INTERBANK RTGS FINANCIAL CLEARING & SETTLEMENT DISPATCH
          Message Reference : SWIFT-MT103-IN20261004-98421
          Transaction Type  : High-Value Interbank Fund Transfer
          Amount            : INR 12,50,000.00
          Sender Account    : 0928104000128491 (State Bank of India, Surat)
          Receiver Account  : 50200049281140 (HDFC Bank Ltd, Mumbai)
          Security Layer    : AES-128-CBC / RSA-2048 Hybrid Encryption
          ================================================================================
          '''
          while len(financial_text.encode('utf-8')) < 1024:
              financial_text += '# RBI-RTGS-AUDIT-RECORD-PAD: INTEGRITY CHECKPASS #\n'
          
          payload = financial_text.encode('utf-8')

          # 2. Key Generation & Hybrid Encryption
          rx_priv = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          rx_pub = rx_priv.public_key()
          aes_key = os.urandom(16)
          iv = os.urandom(16)

          cipher = AES.new(aes_key, AES.MODE_CBC, iv)
          ciphertext = cipher.encrypt(pad(payload, 16))
          enc_aes_key = rx_pub.encrypt(
              aes_key,
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None)
          )

          wire_data = enc_aes_key + iv + ciphertext

          # 3. Write Authentic PCAP Capture File
          pcap_hdr = struct.pack('<IHHIIII', 0xa1b2c3d4, 2, 4, 0, 0, 65535, 1)
          eth = b'\x00\x0c\x29\x68\x22\x91\x00\x50\x56\xc0\x00\x08\x08\x00'
          
          def make_pkt(src, dst, seq, ack, flags, data=b''):
              ip = struct.pack('!BBHHHBBH4s4s', 0x45, 0, 40 + len(data), 0x1234, 0x4000, 64, 6, 0, bytes([127,0,0,1]), bytes([127,0,0,1]))
              tcp = struct.pack('!HHIIBBHHH', src, dst, seq, ack, (5<<4), flags, 65535, 0, 0)
              return eth + ip + tcp + data

          t = int(time.time())
          pkts = [
              make_pkt(54321, 9999, 1000, 0, 0x02),           # SYN
              make_pkt(9999, 54321, 2000, 1001, 0x12),        # SYN-ACK
              make_pkt(54321, 9999, 1001, 2001, 0x10),        # ACK
              make_pkt(54321, 9999, 1001, 2001, 0x18, wire_data) # Encrypted Payload
          ]

          with open('cipat_network_capture.pcap', 'wb') as f:
              f.write(pcap_hdr)
              for i, pkt in enumerate(pkts):
                  f.write(struct.pack('<IIII', t, i * 1000, len(pkt), len(pkt)) + pkt)

          print('[SUCCESS] Simulated network transmission and generated cipat_network_capture.pcap')
          "

      - name: Wireshark Analysis & TCP Stream Inspection
        run: |
          echo "================================================================="
          echo "           WIRESHARK / TSHARK PACKET LIST SUMMARY                "
          echo "================================================================="
          tshark -r cipat_network_capture.pcap

          echo ""
          echo "================================================================="
          echo "      FOLLOW TCP STREAM (WHAT AN EAVESDROPPER CAPTURES)          "
          echo "================================================================="
          tshark -r cipat_network_capture.pcap -z "follow,tcp,ascii,0"

      - name: Upload PCAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipat-pcap-evidence
          path: cipat_network_capture.pcap
